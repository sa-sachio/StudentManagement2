<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>受講生一覧</title>
</head>

<body>

<!-- 共通ヘッダー -->
<div th:replace="~{common/header :: header}"></div>

<h1>受講生一覧</h1>

<form th:action="@{/view/studentList}" method="get"
      th:object="${studentSearchCondition}">

  <input type="hidden" name="searched" value="true"/>

  名前：
  <input type="text" th:field="*{name}" />

  メール：
  <input type="text" th:field="*{email}" />

  地域：
  <input type="text" th:field="*{area}" />

  性別：
  <select th:field="*{gender}">
    <option value="">指定なし</option>
    <option value="男性">男性</option>
    <option value="女性">女性</option>
  </select>

  <button type="submit">検索</button>

</form>

<br>

<table border="1">

  <tr>
    <th>ID</th>
    <th>名前</th>
    <th>メール</th>
    <th>地域</th>
    <th>性別</th>
    <th>更新</th>
    <th>削除</th>
  </tr>

  <tr th:each="studentDetail : ${studentList}">

    <td th:text="${studentDetail.student.id}"></td>
    <td th:text="${studentDetail.student.name}"></td>
    <td th:text="${studentDetail.student.email}"></td>
    <td th:text="${studentDetail.student.area}"></td>
    <td th:text="${studentDetail.student.sex}"></td>

    <td>
      <a th:href="@{/view/student/{id}(id=${studentDetail.student.id})}">
        更新
      </a>
    </td>

    <td>
      <form th:action="@{/view/deleteStudent}" method="post">
        <input type="hidden"
               name="id"
               th:value="${studentDetail.student.id}">
        <button type="submit"
                onclick="return confirm('この受講生を削除しますか？');">
          削除
        </button>
      </form>
    </td>
  </tr>

</table>

<br>

<div th:if="${message}">
  <p th:text="${message}" style="color: green;"></p>
</div>

</body>
</html>
