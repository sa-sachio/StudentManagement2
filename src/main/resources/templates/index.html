<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>受講生管理システム</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }

    .container {
      width: 400px;
      margin: 100px auto;
      padding: 30px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
    }

    .menu a {
      display: block;
      margin: 15px 0;
      padding: 12px;
      text-decoration: none;
      background-color: #4CAF50;
      color: white;
      border-radius: 5px;
      font-size: 16px;
    }

    .menu a:hover {
      background-color: #45a049;
    }

     .menu a.status-btn {
      background-color: #a52a2a;
      font-size: 16px;
      padding: 10px;
      width: 85%;          /* ← 追加（好きな幅に調整OK） */
      margin: 10px auto;
    }

    .menu a.status-btn:hover {
      background-color: #8b2323;
    }

  </style>
</head>
<body>

<div class="container">
  <h1>受講生管理システム</h1>

  <div class="menu">
    <a th:href="@{/view/studentList}">
      受講生一覧・検索/更新/削除
    </a>

    <a th:href="@{/view/newStudent}">
      新規受講生登録
    </a>

    <a th:href="@{/view/applicationStatus}" class="status-btn">
      申込状況表示・変更
    </a>

    <a th:href="@{/view/addApplicationStatus}" class="status-btn">
      申込状況追加
    </a>


  </div>
</div>

</body>
</html>
