<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>受講生登録</title>
</head>
<body>
<div th:replace="~{common/header :: header}"></div>
<h1>受講生登録</h1>
<p th:if="${message}" th:text="${message}" style="color: green;"></p>
<form th:action="@{/view/registerStudent}"
      method="post"
      th:object="${studentDetail}">
  <div>
    <label for="name">名前:</label>
    <input type="text" id="name" th:field="*{student.name}" />

    <!-- ★ エラーメッセージ表示 -->
    <p th:if="${#fields.hasErrors('student.name')}"
       th:errors="*{student.name}"
       style="color:red"></p>
  </div>

  <div>
    <label for="kana_name">カナ名:</label>
    <input type="text" id="kana_name" th:field="*{student.kanaName}" required/>
  </div>
  <div>
    <label for="kana_name">ニックネーム:</label>
    <input type="text" id="nickName" th:field="*{student.nickname}" required/>
  </div>
  <div>
    <label for="email">メールアドレス:</label>
    <input type="text" th:field="*{student.email}" />
    <p th:if="${#fields.hasErrors('student.email')}"
       th:errors="*{student.email}"
       style="color:red"></p>

  </div>
  <div>
    <label for="area">地域:</label>
    <input type="text" id="area" th:field="*{student.area}" required/>
  </div>
  <div>
    <label for="age">年齢:</label>
    <input type="number" th:field="*{student.age}" />
    <p th:if="${#fields.hasErrors('student.age')}"
       th:errors="*{student.age}"
       style="color:red"></p>

  </div>
  <div>
    <label>性別:</label>
    <label for="male">
      <input type="radio" id="male" th:field="*{student.sex}" value="男"/> 男
    </label>
    <label for="female">
      <input type="radio" id="female" th:field="*{student.sex}" value="女"/> 女
    </label>
    <label for="others">
      <input type="radio" id="others" th:field="*{student.sex}" value="その他"/> その他
    </label>
  </div>
  <div>
    <label for="remark">備考:</label>
    <input type="text" id="remark" th:field="*{student.remark}" required/>
  </div>
  <div>
    <label for="course_name">受講コース名:</label>
    <select id="course_name"
            th:field="*{studentCourseList[0].courseName}">
      <option value="">選択してください</option>
      <option value="JavaCourse">Javaコース</option>
      <option value="WebCreatingCourse">Web制作コース</option>
      <option value="AWSCourse">AWSコース</option>
      <option value="designCourse">デザインコース</option>
      <option value="marketingCourse">マーケティングコース</option>
    </select>
  </div>
  <div>
    <button type="submit">登録</button>
  </div>
</form>
</body>
</html>
